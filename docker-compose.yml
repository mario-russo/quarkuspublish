services:
  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: banco
      POSTGRES_USER: mario-russo
      POSTGRES_PASSWORD: mario-russo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mario-russo -d banco"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/mario-russo/quarkuspublish/backend-quarkus:latest
    # build: ./backend
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KIND: postgresql
      DB_USER: mario-russo
      DB_PASSWORD: mario-russo
      DB_URL: jdbc:postgresql://postgres:5432/banco
      PUBLIC_KEY: /run/secrets/public_key
      PRIVATE_KEY: /run/secrets/private_key
      ISSUER: mario-russo
      CORS_ORIGINS: http://localhost:9000
    ports:
      - "8080:8080"
    networks:
      - app-network
    secrets:
      - public_key
      - private_key

  frontend:
    restart: "no"
    image: ghcr.io/mario-russo/quarkuspublish/frontend-vue:latest
    # build:
    #   context: ./publicacao-frontend
    #   dockerfile: Dockerfile.prod
      # args:                            
      #   VITE_API_URL: http://localhost:8080
    environment:                            
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    ports:
      - "9000:80"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge

secrets:
  public_key:
    file: ./secrets/publicKey.pem
  private_key:
    file: ./secrets/privateKey.pem
