name: Quarkus CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/mario-russo/backend-quarkus

jobs:

# -------------------------------------------------------------
# TESTES BACKEND (JVM + Postgres)
# -------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: mario-russo
          POSTGRES_PASSWORD: mario-russo
          POSTGRES_DB: banco
        options: >-
          --health-cmd="pg_isready -U mario-russo -d banco"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USER: mario-russo
      DB_PASSWORD: mario-russo
      DB_URL: jdbc:postgresql://localhost:5432/banco
      ISSUER: mario-russo
      PUBLIC_KEY: classpath:/publicKey.pem
      PRIVATE_KEY: classpath:/privateKey.pem

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Injetar JWT
        working-directory: ./backend
        env:
          JWT_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
        run: |
          mkdir -p src/main/resources
          echo "$JWT_PRIVATE_KEY" > src/main/resources/privateKey.pem
          echo "$JWT_PUBLIC_KEY" > src/main/resources/publicKey.pem

      - name: Testes JVM
        working-directory: ./backend
        run: mvn -B test


# -------------------------------------------------------------
# BUILD BACKEND NATIVO + DOCKER + GHCR
# -------------------------------------------------------------
  build-backend:
    needs: test-backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Injetar JWT
        working-directory: ./backend
        env:
          JWT_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
        run: |
          mkdir -p src/main/resources
          echo "$JWT_PRIVATE_KEY" > src/main/resources/privateKey.pem
          echo "$JWT_PUBLIC_KEY" > src/main/resources/publicKey.pem

      - name: 🔑 Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CORREÇÃO: -Pnative ativado e empacotamento Docker pelo Quarkus Jib para o GHCR
      - name: Build Native
        working-directory: ./backend
        run: mvn -B clean package -Pnative

      - name: Build Docker Image
        working-directory: ./backend
        run: |
          docker build \
            -f src/main/docker/Dockerfile.native-micro \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
            
      - name: Verificar binário nativo
        working-directory: ./backend
        run: |
          ls -lh target/
          file target/*-runner
            
      - name: Enviar Imagem Nativa para o GHCR
        run: | 
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
        
      - name: 🏷️ Atualizar latest
        run: |
          ls -lh target/
          test -f target/*-runner

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Image
        working-directory: ./backend
        run: |
          docker build \
            -f src/main/docker/Dockerfile.native-micro \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Image
        run: docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Tag Latest
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Deploy Render
        run: curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"


# -------------------------------------------------------------
# FRONTEND
# -------------------------------------------------------------
  build-frontend:
    needs: test-backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./publicacao-frontend
          file: ./publicacao-frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/mario-russo/frontend-vue:latest
