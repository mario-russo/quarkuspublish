#application-prod.properties
quarkus.datasource.db-kind=${KIND:postgresql}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

quarkus.hibernate-orm.database.generation=none

quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTI
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition

mp.jwt.verify.issuer=${ISSUER}
mp.jwt.verify.publickey.location=${PUBLIC_KEY}
smallrye.jwt.sign.key.location=${PRIVATE_KEY}